name: Merge into target
description: >
  Brings one commit onto another and leaves the result checked out: a fast-forward
  when the target has nothing new (so test and review show the pushed commit itself),
  otherwise a merge commit named after the pushed branch's latest commit. Author and
  dates are pinned, so every job that runs this with the same inputs gets the same
  commit SHA. On a conflict it fails and lists the conflicting files. Logic and tests:
  merge.mjs, tests/merge-into.test.mjs. Needs a checkout with fetch-depth 0 first.

inputs:
  base-sha:
    description: Commit of the branch being merged into (e.g. test)
    required: true
  head-sha:
    description: Commit being merged in (e.g. the pushed personal branch)
    required: true
  message:
    description: Body of the merge commit, when one is needed (e.g. "Merge adam into test")
    required: true

outputs:
  sha:
    description: The resulting commit
    value: ${{ steps.merge.outputs.sha }}
  mode:
    description: up-to-date, fast-forward or merge
    value: ${{ steps.merge.outputs.mode }}

runs:
  using: composite
  steps:
    - id: merge
      shell: bash
      env:
        BASE_SHA: ${{ inputs.base-sha }}
        HEAD_SHA: ${{ inputs.head-sha }}
        MESSAGE: ${{ inputs.message }}
      run: node "$GITHUB_ACTION_PATH/merge.mjs"
